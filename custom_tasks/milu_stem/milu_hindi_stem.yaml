task: milu_hindi_stem
dataset_path: ai4bharat/MILU
dataset_kwargs:
  data_dir: Hindi
test_split: test
fewshot_split: validation
num_fewshot: 5
process_docs: !function utils.filter_stem
output_type: multiple_choice
doc_to_text: !function utils.format_mcq
doc_to_target: !function utils.get_answer_index
doc_to_choice: ["A", "B", "C", "D"]
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 2.0
