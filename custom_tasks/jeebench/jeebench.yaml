task: jeebench
dataset_path: daman1209arora/jeebench
test_split: test
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
output_type: generate_until
target_delimiter: ""
generation_kwargs:
  until: ["Question:", "\n\n\n", "\n\nQ:"]
  max_gen_toks: 256
  do_sample: false
  temperature: 0.0
filter_list:
  - name: "final-answer"
    filter:
      - function: "regex"
        regex_pattern: "Final answer:\\s*([A-Da-d,\\s]+|-?\\d+\\.?\\d*)"
        group_select: 0
      - function: "take_first"
metric_list:
  - metric: !function utils.jee_score
    aggregation: mean
    higher_is_better: true
metadata:
  version: 2.0
